<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xixi · 刷新网页版本</title>
  <style>
    body{min-height:100vh;display:grid;place-items:center;margin:0;background:#14101d;color:#fff;font:16px/1.6 system-ui,sans-serif}
    main{max-width:28rem;padding:2rem;text-align:center}a{color:#ff93ae}
  </style>
</head>
<body>
  <main>
    <h1>正在刷新网页版本…</h1>
    <p id="status">只清理旧版网页文件，不会删除已保存的照片、音频或设置。</p>
    <p><a href="./">返回 Xixi 首页</a></p>
  </main>
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(registration => registration.scope.startsWith(location.origin)).map(registration => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('xixi-')).map(key => caches.delete(key)));
      }
      location.replace('./?refreshed=' + Date.now());
    })().catch(() => {
      document.querySelector('#status').textContent = '自动刷新未完成。请点击“返回 Xixi 首页”再试；已保存的照片和音频不会被清理。';
    });
  </script>
</body>
</html>
